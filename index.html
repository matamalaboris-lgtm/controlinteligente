<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Control Inteligente</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0d13;--panel:#141924;--panel2:#1b2230;--accent:#6cbf3a;--text:#e7eaf0;--muted:#8a93a6;--ok:#35d0a5;--warn:#f5b544;--danger:#f76a6a;--border:#232c3d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 600px at 70% -10%,rgba(108,191,58,.12),transparent),var(--bg)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:34px;width:100%;max-width:390px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.logo .badge{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#4e9427);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;color:#08120a}
.logo h1{font-size:19px;letter-spacing:.5px}
.logo small{color:var(--muted);font-size:11px;display:block;font-weight:400}
label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:11px 12px;color:var(--text);font-size:14px;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.btn{width:100%;background:var(--accent);color:#08120a;border:none;border-radius:9px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:20px;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.btn.sm{width:auto;padding:8px 14px;margin:0;font-size:13px}
.btn.xs{width:auto;padding:5px 10px;margin:0;font-size:12px}
.btn.danger{background:var(--danger);color:#fff}
.msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px}
.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
#app{display:flex;min-height:100vh}
.side{width:236px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto}
.side .logo{padding:20px 18px;margin:0;border-bottom:1px solid var(--border)}
.nav{padding:10px;flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:9px;color:var(--muted);font-size:14px;cursor:pointer;margin-bottom:2px;transition:.12s;position:relative}
.nav a:hover{background:var(--panel2);color:var(--text)}
.nav a.active{background:rgba(108,191,58,.14);color:var(--accent);font-weight:600}
.nav .ico{width:20px;text-align:center}
.nav .badge2{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px}
.nav .sep{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:14px 13px 6px;opacity:.6}
.userbox{padding:14px 16px;border-top:1px solid var(--border);font-size:13px}
.userbox b{display:block;color:var(--text)}
.userbox span{color:var(--muted);font-size:11px}
.main{flex:1;margin-left:236px;padding:26px 30px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:14px;flex-wrap:wrap}
.topbar h2{font-size:22px}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
.pgActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:18px;position:relative;overflow:hidden}
.kpi .n{font-size:30px;font-weight:800}
.kpi .l{color:var(--muted);font-size:13px;margin-top:4px}
.kpi .ic{position:absolute;right:16px;top:16px;font-size:22px;opacity:.5}
.kpi.acc{border-left:3px solid var(--accent)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:20px;margin-bottom:20px}
.panel h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar input,.toolbar select{width:auto;padding:8px 11px;font-size:13px}
.toolbar .search{flex:1;min-width:180px;max-width:320px}
.count{color:var(--muted);font-size:12px;margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--border);font-size:12px;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
td{padding:11px 10px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--panel2)}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.tag.ok{background:rgba(53,208,165,.16);color:var(--ok)}
.tag.warn{background:rgba(245,181,68,.16);color:var(--warn)}
.tag.danger{background:rgba(247,106,106,.16);color:var(--danger)}
.tag.mut{background:var(--panel2);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:34px;font-size:13px}
.empty .big{font-size:34px;display:block;margin-bottom:8px;opacity:.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal.wide{max-width:640px}
.modal h3{margin-bottom:6px}
.modal .x{float:right;cursor:pointer;color:var(--muted);font-size:20px}
.row{display:flex;gap:10px}.row>*{flex:1}
.map{position:relative;height:440px;background:var(--panel2) url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22><path d=%22M0 0H40V40%22 fill=%22none%22 stroke=%22%23232c3d%22 stroke-width=%221%22/></svg>');border-radius:11px;overflow:hidden}
.pin{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer}
.pin .dot{width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 5px rgba(108,191,58,.25);margin:0 auto}
.pin .lbl{font-size:10px;color:var(--text);margin-top:3px;background:rgba(0,0,0,.5);padding:1px 5px;border-radius:4px;white-space:nowrap}
.prog{height:9px;background:var(--panel2);border-radius:6px;overflow:hidden}
.prog>div{height:100%;background:var(--accent);transition:width .3s}
.chk{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px;cursor:pointer;transition:.12s}
.chk:hover{background:var(--panel2)}
.chk.done{opacity:.6}.chk.done .txt{text-decoration:line-through}
.chk .box{width:20px;height:20px;border-radius:5px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chk.done .box{background:var(--accent);border-color:var(--accent);color:#08120a}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:9px;padding:13px 20px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:100;animation:slideup .25s;max-width:90vw;text-align:center}
.toast.err{border-left-color:var(--danger)}
@keyframes slideup{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.sos{position:fixed;bottom:26px;right:26px;background:var(--danger);color:#fff;border:none;width:64px;height:64px;border-radius:50%;font-size:11px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(247,106,106,.5);z-index:40}
.sos:hover{filter:brightness(1.1)}
.pill{display:inline-flex;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;align-items:center}
.detail-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px}
.detail-grid b{color:var(--muted);font-weight:600}
/* NFC scan */
.nfc-scan{text-align:center;padding:14px;border:1px dashed var(--border);border-radius:11px;margin-bottom:14px}
.nfc-ring{width:78px;height:78px;border-radius:50%;margin:6px auto 10px;border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:32px}
.nfc-ring.scanning{animation:pulse 1.3s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(108,191,58,.5)}70%{box-shadow:0 0 0 16px rgba(108,191,58,0)}100%{box-shadow:0 0 0 0 rgba(108,191,58,0)}}
/* MOBILE GUARD VIEW */
#mguard{min-height:100vh;background:var(--bg);padding-bottom:90px}
.mhead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:10}
.mhead .badge{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#4e9427);display:flex;align-items:center;justify-content:center;font-weight:800;color:#08120a;font-size:14px}
.mhead b{font-size:15px}.mhead small{display:block;color:var(--muted);font-size:11px}
.mbody{padding:16px}
.mcard{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
.mbtn{display:block;width:100%;padding:17px;border-radius:12px;border:none;font-size:16px;font-weight:700;margin-top:12px;cursor:pointer}
.mbtn.pri{background:var(--accent);color:#08120a}
.mbtn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.mbtn.dng{background:var(--danger);color:#fff}
.mpt{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:11px;margin-bottom:10px}
.mpt.done{border-color:var(--accent);background:rgba(108,191,58,.08)}
.mpt .st{width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.mpt.done .st{background:var(--accent);border-color:var(--accent);color:#08120a}
.mtab{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);display:flex;z-index:20}
.mtab a{flex:1;text-align:center;padding:11px 4px;color:var(--muted);font-size:11px;cursor:pointer}
.mtab a.active{color:var(--accent)}
.mtab a .i{display:block;font-size:20px;margin-bottom:2px}
@media(max-width:760px){.side{width:100%;height:auto;position:static}.main{margin-left:0;padding:16px}#app{flex-direction:column}.grid2,.grid3{grid-template-columns:1fr}.map{height:340px}table{font-size:12px}th,td{padding:8px 6px}}
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <div class="logo"><div class="badge">CI</div><div><h1>CONTROL INTELIGENTE</h1><small>Gestión de seguridad</small></div></div>
    <label>Correo</label>
    <input id="email" type="email" placeholder="correo@empresa.cl" autocomplete="username">
    <label>Contraseña</label>
    <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="btnLogin">Iniciar sesión</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>
<div id="app" class="hidden">
  <aside class="side">
    <div class="logo"><div class="badge">CI</div><div><h1 style="font-size:15px">CONTROL INTELIGENTE</h1><small id="empName">—</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="userbox">
      <b id="uName">—</b><span id="uRol">—</span>
      <button class="btn sec sm" id="btnLogout" style="margin-top:10px;width:100%">Cerrar sesión</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><h2 id="pgTitle">Panel</h2><div class="sub" id="pgSub"></div></div>
      <div class="pgActions" id="pgActions"></div>
    </div>
    <div id="view"></div>
  </main>
  <button class="sos" id="btnSos">SOS</button>
</div>
<div id="mguard" class="hidden">
  <div class="mhead">
    <div class="badge">CI</div>
    <div style="flex:1"><b>Control Inteligente</b><small id="mgName">—</small></div>
    <button class="btn xs sec" id="mgLogout" style="margin:0">Salir</button>
  </div>
  <div class="mbody" id="mgView"></div>
  <nav class="mtab" id="mgTab"></nav>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
const SB_URL='https://jnrkqmazotalwqkcbygh.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpucmtxbWF6b3RhbHdxa2NieWdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NjYyMjYsImV4cCI6MjEwMDM0MjIyNn0.CprxETe2BBZMZVF9Kjq4Ubh2tpOsdqV9Fbgm3UaYBqM';
const sb=supabase.createClient(SB_URL,SB_KEY);
let ME=null, EMP=null, INST_CACHE=[], MOBILE=false;
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fdate=d=>d?new Date(d).toLocaleString('es-CL',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const ftime=d=>d?new Date(d).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}):'—';
function toast(msg,err){const r=$('#toastRoot');const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;r.appendChild(t);setTimeout(()=>t.remove(),2800);}
$('#btnLogin').onclick=doLogin;
$('#pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
async function doLogin(){
  const m=$('#loginMsg'); m.className='msg'; m.textContent='Ingresando…';
  const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pass').value});
  if(error){m.className='msg err';m.textContent='Error: '+error.message;return;}
  await boot();
}
const logout=async()=>{await sb.auth.signOut();location.reload();};
$('#btnLogout').onclick=logout;$('#mgLogout').onclick=logout;
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('#login').classList.remove('hidden');$('#app').classList.add('hidden');$('#mguard').classList.add('hidden');return;}
  const {data:prof,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(error||!prof){$('#loginMsg').className='msg err';$('#loginMsg').textContent='No se encontró el perfil.';await sb.auth.signOut();return;}
  ME=prof;
  if(ME.empresa_id){const {data:e}=await sb.from('empresas').select('*').eq('id',ME.empresa_id).single();EMP=e;}
  const {data:ins}=await sb.from('instalaciones').select('*').order('nombre');INST_CACHE=ins||[];
  $('#login').classList.add('hidden');
  const smallScreen=window.matchMedia('(max-width:760px)').matches;
  MOBILE = ME.rol==='guardia' && smallScreen;
  if(MOBILE){ $('#mguard').classList.remove('hidden'); $('#mgName').textContent=(ME.nombre||ME.email)+' · Guardia'; mgBuildTabs(); mgGo('ronda'); return; }
  $('#app').classList.remove('hidden');
  $('#uName').textContent=ME.nombre||ME.email;
  $('#uRol').textContent=rolLabel(ME.rol);
  $('#empName').textContent=EMP?EMP.nombre:(ME.rol==='super_admin'?'Todas las empresas':'—');
  await buildNav();
  go(ME.rol==='guardia'?'rondas':'dashboard');
}
const rolLabel=r=>({super_admin:'Super Admin',admin:'Administrador',supervisor:'Supervisor',guardia:'Guardia',cliente:'Cliente'}[r]||r);
function toCSV(rows,cols){const head=cols.map(c=>'"'+c.h+'"').join(',');const body=rows.map(r=>cols.map(c=>'"'+String(c.v(r)).replace(/"/g,'""')+'"').join(',')).join('\n');return head+'\n'+body;}
function downloadCSV(name,csv){const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();toast('Descargado: '+name);}
const MENU=[
  {sep:'Operación'},
  {id:'dashboard',ic:'📊',t:'Panel',roles:['super_admin','admin','supervisor','cliente']},
  {id:'mapa',ic:'🗺️',t:'Mapa en vivo',roles:['super_admin','admin','supervisor']},
  {id:'rondas',ic:'🚶',t:'Rondas',roles:['super_admin','admin','supervisor','guardia']},
  {id:'checklists',ic:'✅',t:'Checklists',roles:['super_admin','admin','supervisor','guardia']},
  {id:'incidentes',ic:'⚠️',t:'Incidentes',roles:['super_admin','admin','supervisor','guardia','cliente'],badge:'incAbiertos'},
  {id:'bitacora',ic:'📓',t:'Bitácora',roles:['super_admin','admin','supervisor','guardia']},
  {sep:'Control de acceso'},
  {id:'visitantes',ic:'🚶‍♂️',t:'Visitantes',roles:['super_admin','admin','supervisor','guardia']},
  {id:'vehiculos',ic:'🚗',t:'Vehículos',roles:['super_admin','admin','supervisor','guardia']},
  {id:'puntos',ic:'📍',t:'Puntos NFC',roles:['super_admin','admin','supervisor']},
  {sep:'Administración'},
  {id:'guardias',ic:'👮',t:'Guardias',roles:['super_admin','admin','supervisor']},
  {id:'usuarios',ic:'👥',t:'Usuarios',roles:['super_admin','admin']},
  {id:'instalaciones',ic:'🏢',t:'Instalaciones',roles:['super_admin','admin']},
  {id:'reportes',ic:'📈',t:'Reportes',roles:['super_admin','admin','supervisor','cliente']},
  {id:'empresas',ic:'🏰',t:'Empresas',roles:['super_admin']}
];
let BADGES={incAbiertos:0};
async function refreshBadges(){
  const {count}=await sb.from('incidentes').select('id',{count:'exact',head:true}).neq('estado','cerrado');
  BADGES.incAbiertos=count||0;
  document.querySelectorAll('.nav a').forEach(a=>{
    const m=MENU.find(x=>x.id===a.dataset.id);
    const b=a.querySelector('.badge2');if(b)b.remove();
    if(m&&m.badge&&BADGES[m.badge]>0){const s=document.createElement('span');s.className='badge2';s.textContent=BADGES[m.badge];a.appendChild(s);}
  });
}
async function buildNav(){
  const nav=$('#nav');nav.innerHTML='';
  MENU.forEach(m=>{
    if(m.sep){const d=document.createElement('div');d.className='sep';d.textContent=m.sep;nav.appendChild(d);return;}
    if(!m.roles.includes(ME.rol))return;
    const a=document.createElement('a');a.dataset.id=m.id;a.innerHTML='<span class="ico">'+m.ic+'</span>'+m.t;
    a.onclick=()=>go(m.id);nav.appendChild(a);
  });
  await refreshBadges();
}
function go(id){
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.id===id));
  $('#pgActions').innerHTML='';
  (VIEWS[id]||VIEWS.dashboard)();
}
function setHead(t,s){$('#pgTitle').textContent=t;$('#pgSub').textContent=s||'';}
function actionBtn(label,fn,cls){const b=document.createElement('button');b.className='btn sm '+(cls||'');if(!cls)b.style.color='#08120a';b.textContent=label;b.onclick=fn;$('#pgActions').appendChild(b);}
const instName=id=>{const i=INST_CACHE.find(x=>x.id===id);return i?i.nombre:'—';};
function instOptions(sel){return '<option value="">— Instalación —</option>'+INST_CACHE.map(i=>'<option value="'+i.id+'"'+(sel===i.id?' selected':'')+'>'+esc(i.nombre)+'</option>').join('');}
function closeModal(){$('#modalRoot').innerHTML='';}
function openModal(title,bodyHtml,onSave,wide){
  $('#modalRoot').innerHTML='<div class="modal-bg"><div class="modal'+(wide?' wide':'')+'"><span class="x" id="mX">✕</span><h3>'+esc(title)+'</h3><div id="mBody">'+bodyHtml+'</div>'+(onSave?'<div class="msg" id="mMsg"></div><button class="btn" id="mSave">Guardar</button>':'')+'</div></div>';
  $('#mX').onclick=closeModal;
  document.querySelector('.modal-bg').onclick=e=>{if(e.target.classList.contains('modal-bg'))closeModal();};
  if(onSave)$('#mSave').onclick=async()=>{const mm=$('#mMsg');mm.className='msg';mm.textContent='Guardando…';try{await onSave();mm.className='msg ok';mm.textContent='Guardado';setTimeout(closeModal,400);}catch(e){mm.className='msg err';mm.textContent='Error: '+(e.message||e);}};
}
function mv(id){const el=document.getElementById(id);return el?(el.value.trim()||null):null;}
let TSTATE={};
async function renderTable(cfg){
  setHead(cfg.title,cfg.sub);
  TSTATE={data:[],search:'',sort:null,asc:true,filter:'',cfg};
  if(cfg.canCreate&&cfg.canCreate())actionBtn('+ '+cfg.createLabel,cfg.onCreate);

  if(cfg.filters)filterHtml='<select id="tFilter"><option value="">Todos</option>'+cfg.filters.map(f=>'<option value="'+f.v+'">'+f.l+'</option>').join('')+'</select>';

  let q=sb.from(cfg.table).select(cfg.select||'*');
  if(cfg.order)q=q.order(cfg.order.col,{ascending:cfg.order.asc!==false});
  const {data,error}=await q;
  if(error){$('#tbl').innerHTML='<div class="empty">Error: '+esc(error.message)+'</div>';return;}

  const s=$('#tSearch');s.oninput=()=>{TSTATE.search=s.value.toLowerCase();paintTable();};
  const f=$('#tFilter');if(f)f.onchange=()=>{TSTATE.filter=f.value;paintTable();};
  paintTable();
}
function paintTable(){
  const {data,cfg,search,filter,sort,asc}=TSTATE;
  let rows=data.slice();
  if(filter&&cfg.filterFn)rows=rows.filter(r=>cfg.filterFn(r,filter));
  if(search)rows=rows.filter(r=>cfg.cols.some(c=>{const v=c.raw?c.raw(r):(c.k?r[c.k]:'');return String(v==null?'':v).toLowerCase().includes(search);}));
  if(sort!=null){const c=cfg.cols[sort];rows.sort((a,b)=>{const va=c.raw?c.raw(a):a[c.k],vb=c.raw?c.raw(b):b[c.k];return (va>vb?1:va<vb?-1:0)*(asc?1:-1);});}
  $('#tCount').textContent=rows.length+' de '+data.length;
  const el=$('#tbl');
  if(!rows.length){el.innerHTML=cfg.emptyHtml||'<div class="empty"><span class="big">📭</span>Sin registros.</div>';return;}
  let h='<table><thead><tr>'+cfg.cols.map((c,i)=>'<th data-i="'+i+'">'+c.h+(sort===i?(asc?' ↑':' ↓'):'')+'</th>').join('')+(cfg.actions?'<th></th>':'')+'</tr></thead><tbody>';
  rows.forEach(r=>{h+='<tr>'+cfg.cols.map(c=>'<td>'+(c.r?c.r(r):esc(r[c.k]))+'</td>').join('')+(cfg.actions?'<td style="text-align:right">'+cfg.actions(r)+'</td>':'')+'</tr>';});
  h+='</tbody></table>';el.innerHTML=h;
  el.querySelectorAll('th[data-i]').forEach(th=>th.onclick=()=>{const i=+th.dataset.i;TSTATE.asc=TSTATE.sort===i?!TSTATE.asc:true;TSTATE.sort=i;paintTable();});
}
function exportTable(){const {cfg,data}=TSTATE;const cols=cfg.cols.map(c=>({h:c.h,v:r=>{const v=c.raw?c.raw(r):(c.k?r[c.k]:'');return v==null?'':v;}}));downloadCSV(cfg.table+'.csv',toCSV(data,cols));}

let NFC_READER=null, NFC_ABORT=null;
const nfcSupported=()=>('NDEFReader' in window);
async function startNFC(onTag){
  if(!nfcSupported())throw new Error('Este dispositivo/navegador no soporta Web NFC (usa Chrome en Android).');
  NFC_READER=new NDEFReader();
  NFC_ABORT=new AbortController();
  await NFC_READER.scan({signal:NFC_ABORT.signal});
  NFC_READER.onreading=ev=>{
    let code=ev.serialNumber||'';
    for(const rec of ev.message.records){try{if(rec.recordType==='text'){code=new TextDecoder().decode(rec.data);break;}}catch(e){}}
    onTag((code||'').trim());
  };
}
function stopNFC(){try{if(NFC_ABORT)NFC_ABORT.abort();}catch(e){}NFC_READER=null;NFC_ABORT=null;}

// marca un punto (por id) en la ronda y persiste
async function marcarPunto(ronda, puntoId){
  const set=new Set(ronda.puntos_marcados||[]);
  if(set.has(puntoId))return false;
  set.add(puntoId);
  const arr=[...set];
  const {error}=await sb.from('rondas').update({puntos_marcados:arr}).eq('id',ronda.id);
  if(error){toast(error.message,true);return false;}
  ronda.puntos_marcados=arr;return true;
}
// busca punto por codigo NFC o serial dentro de la lista
function findPunto(pts, code){
  return pts.find(p=>p.codigo && p.codigo.toLowerCase()===code.toLowerCase());
}

  const r=TSTATE.data.find(x=>x.id===id);if(!r)return;

function renderRondaModal(r,list,active){
  const marked=new Set(r.puntos_marcados||[]);
  const done=[...marked].filter(id=>list.some(p=>p.id===id)).length;
  const pc=list.length?Math.round(done/list.length*100):0;
  let h='<div class="detail-grid" style="margin-bottom:14px"><b>Instalación</b><span>'+esc(instName(r.instalacion_id))+'</span><b>Estado</b><span>'+stTag(r.estado)+'</span><b>Inicio</b><span>'+fdate(r.inicio)+'</span></div>';
  if(active&&list.length){
    h+='<div class="nfc-scan" id="nfcBox"><div class="nfc-ring" id="nfcRing">📡</div><div id="nfcTxt" style="font-size:13px;color:var(--muted)">'+(nfcSupported()?'Pulsa “Escanear NFC” y acerca el tag al teléfono.':'Este dispositivo no soporta NFC; marca los puntos manualmente.')+'</div>';
    if(nfcSupported())h+='<button class="btn sm" id="nfcBtn" style="color:#08120a;margin-top:10px">Escanear NFC</button>';
    h+='</div>';
  }
  h+='<div style="margin-bottom:6px;font-size:13px;color:var(--muted)">Progreso: '+done+'/'+list.length+' ('+pc+'%)</div><div class="prog" style="margin-bottom:14px"><div style="width:'+pc+'%"></div></div>';
  h+=list.length?list.map(p=>{const d=marked.has(p.id);return '<div class="chk'+(d?' done':'')+'" '+(active&&!d?'onclick="ptTap(\''+r.id+'\',\''+p.id+'\')"':'')+'><div class="box">'+(d?'✓':'')+'</div><div class="txt"><div>'+esc(p.nombre)+'</div><div style="font-size:11px;color:var(--muted)">'+esc(p.ubicacion||'')+(p.codigo?' · NFC: '+esc(p.codigo):'')+'</div></div></div>';}).join(''):'<div class="empty">Esta instalación no tiene puntos NFC. Regístralos en “Puntos NFC”.</div>';
  openModal('Detalle de ronda',h,null,true);
  window.__RONDA={r,list,active};
  const btn=document.getElementById('nfcBtn');

}
async function toggleScan(r){
  const ring=document.getElementById('nfcRing'),txt=document.getElementById('nfcTxt'),btn=document.getElementById('nfcBtn');
  if(NFC_READER){stopNFC();ring.classList.remove('scanning');txt.textContent='Escaneo detenido.';btn.textContent='Escanear NFC';return;}
  try{
    await startNFC(async code=>{
      const {r:rr,list}=window.__RONDA;
      const p=findPunto(list,code);
      if(!p){toast('Tag no reconocido: '+code,true);return;}
      const ok=await marcarPunto(rr,p.id);
      if(ok){toast('✓ Punto marcado: '+p.nombre);renderRondaModal(rr,list,true);}
      else toast('Ese punto ya estaba marcado.');
    });
    ring.classList.add('scanning');txt.textContent='Escaneando… acerca el tag NFC.';btn.textContent='Detener';
  }catch(e){toast(e.message,true);}
}

  const cerr=(ro.data||[]).filter(r=>r.estado==='completada').length;
  $('#rk').innerHTML=[['Incidentes totales',I.length,'⚠️'],['Rondas completadas',cerr,'✅'],['Visitas registradas',(vis.data||[]).length,'🚶‍♂️'],['Vehículos',(veh.data||[]).length,'🚗']].map(k=>'<div class="kpi"><span class="ic">'+k[2]+'</span><div class="n">'+k[1]+'</div><div class="l">'+k[0]+'</div></div>').join('');

// ===== VISTA MÓVIL GUARDIA =====
const MGTABS=[{id:'ronda',ic:'🚶',t:'Ronda'},{id:'checklist',ic:'✅',t:'Checklist'},{id:'nota',ic:'📓',t:'Novedad'},{id:'sos',ic:'🚨',t:'SOS'}];
function mgBuildTabs(){
  const t=$('#mgTab');t.innerHTML='';
  MGTABS.forEach(x=>{const a=document.createElement('a');a.dataset.id=x.id;a.innerHTML='<span class="i">'+x.ic+'</span>'+x.t;a.onclick=()=>mgGo(x.id);t.appendChild(a);});
}
function mgGo(id){
  if(id==='sos'){doSos();return;}
  document.querySelectorAll('.mtab a').forEach(a=>a.classList.toggle('active',a.dataset.id===id));
  ({ronda:mgRonda,checklist:mgChecklist,nota:mgNota}[id]||mgRonda)();
}
async function mgRonda(){
  const v=$('#mgView');v.innerHTML='<div class="mcard">Cargando ronda…</div>';
  let {data:act}=await sb.from('rondas').select('*').eq('estado','en_curso').order('inicio',{ascending:false}).limit(1);
  let ronda=act&&act[0];
  if(!ronda){
    v.innerHTML='<div class="mcard" style="text-align:center"><div style="font-size:40px">🚶</div><h3 style="margin:8px 0">Sin ronda activa</h3><p style="color:var(--muted);font-size:14px">Inicia una ronda para comenzar a marcar puntos.</p><label style="text-align:left">Instalación</label><select id="mgIns">'+instOptions()+'</select><button class="mbtn pri" id="mgStart">Iniciar ronda</button></div>';
    $('#mgStart').onclick=async()=>{const iid=mv('mgIns');const {error}=await sb.from('rondas').insert({instalacion_id:iid,estado:'en_curso',inicio:new Date().toISOString(),empresa_id:ME.empresa_id,puntos_marcados:[]});if(error)toast(error.message,true);else{toast('Ronda iniciada');mgRonda();}};
    return;
  }
  const {data:pts}=await sb.from('puntos_nfc').select('*').eq('instalacion_id',ronda.instalacion_id).order('nombre');
  const list=pts||[];window.__RONDA={r:ronda,list,active:true};
  mgPaintRonda();
}
function mgPaintRonda(){
  const {r,list}=window.__RONDA;const marked=new Set(r.puntos_marcados||[]);
  const done=[...marked].filter(id=>list.some(p=>p.id===id)).length;const pc=list.length?Math.round(done/list.length*100):0;
  let h='<div class="mcard"><div style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:16px">'+esc(instName(r.instalacion_id))+'</b><div style="color:var(--muted);font-size:12px">Inicio '+ftime(r.inicio)+'</div></div>'+stTag(r.estado)+'</div>';
  h+='<div style="margin:14px 0 6px;font-size:13px;color:var(--muted)">Progreso '+done+'/'+list.length+' ('+pc+'%)</div><div class="prog"><div style="width:'+pc+'%"></div></div>';
  if(nfcSupported())h+='<button class="mbtn pri" id="mgScan">📡 Escanear punto NFC</button><div id="mgScanTxt" style="text-align:center;font-size:12px;color:var(--muted);margin-top:8px"></div>';
  else h+='<div style="text-align:center;font-size:12px;color:var(--warn);margin-top:10px">NFC no disponible aquí. Marca los puntos tocándolos.</div>';
  h+='<button class="mbtn dng" id="mgFin" style="margin-top:10px">Finalizar ronda</button></div>';
  h+='<div class="mcard"><b>Puntos de control</b><div style="margin-top:12px">';
  h+=list.length?list.map(p=>{const d=marked.has(p.id);return '<div class="mpt'+(d?' done':'')+'" '+(!d?'onclick="mgTap(\''+p.id+'\')"':'')+'><div class="st">'+(d?'✓':'○')+'</div><div style="flex:1"><b>'+esc(p.nombre)+'</b><div style="font-size:12px;color:var(--muted)">'+esc(p.ubicacion||'')+(p.codigo?' · '+esc(p.codigo):'')+'</div></div></div>';}).join(''):'<div class="empty">Esta instalación no tiene puntos NFC configurados.</div>';
  h+='</div></div>';
  $('#mgView').innerHTML=h;
  const fin=$('#mgFin');if(fin)fin.onclick=async()=>{if(!confirm('¿Finalizar la ronda?'))return;await sb.from('rondas').update({estado:'completada',fin:new Date().toISOString()}).eq('id',r.id);toast('Ronda finalizada');mgRonda();};
  const sc=$('#mgScan');if(sc)sc.onclick=mgToggleScan;
}
async function mgTap(pid){const {r,list}=window.__RONDA;const ok=await marcarPunto(r,pid);if(ok){const p=list.find(x=>x.id===pid);toast('✓ '+(p?p.nombre:'Punto')+' marcado');mgPaintRonda();}}
async function mgToggleScan(){
  const txt=$('#mgScanTxt'),btn=$('#mgScan');
  if(NFC_READER){stopNFC();btn.textContent='📡 Escanear punto NFC';btn.classList.remove('sec');btn.classList.add('pri');if(txt)txt.textContent='';return;}
  try{
    await startNFC(async code=>{
      const {r,list}=window.__RONDA;const p=findPunto(list,code);
      if(!p){toast('Tag no reconocido: '+code,true);return;}
      const ok=await marcarPunto(r,p.id);
      if(ok){toast('✓ '+p.nombre);mgPaintRonda();} else toast('Ya estaba marcado.');
    });
    btn.textContent='⏹ Detener escaneo';btn.classList.remove('pri');btn.classList.add('sec');if(txt)txt.textContent='Acerca el teléfono al tag NFC…';
  }catch(e){toast(e.message,true);}
}
async function mgChecklist(){
  const v=$('#mgView');v.innerHTML='<div class="mcard">Cargando…</div>';
  const {data}=await sb.from('checklists').select('*').order('created_at',{ascending:false});
  const list=data||[];
  if(!list.length){v.innerHTML='<div class="mcard" style="text-align:center"><div style="font-size:40px">✅</div><p style="color:var(--muted)">No hay checklists asignados.</p></div>';return;}
  v.innerHTML=list.map(c=>{const it=parseItems(c.items);const done=it.filter(x=>x.d).length;const pc=it.length?Math.round(done/it.length*100):0;return '<div class="mcard" onclick="mgOpenCheck(\''+c.id+'\')"><div style="display:flex;justify-content:space-between"><b>'+esc(c.titulo)+'</b>'+stTag(c.estado)+'</div><div style="color:var(--muted);font-size:12px;margin:6px 0">'+esc(instName(c.instalacion_id))+'</div><div class="prog"><div style="width:'+pc+'%"></div></div><div style="font-size:12px;color:var(--muted);margin-top:4px">'+done+'/'+it.length+' completados</div></div>';}).join('');
}
async function mgOpenCheck(id){
  const {data:c}=await sb.from('checklists').select('*').eq('id',id).single();if(!c)return;
  window.__CK={id,items:parseItems(c.items),titulo:c.titulo};mgPaintCheck();
}
function mgPaintCheck(){
  const it=window.__CK.items;const done=it.filter(x=>x.d).length;const pc=it.length?Math.round(done/it.length*100):0;
  let h='<div class="mcard"><button class="btn xs sec" onclick="mgChecklist()" style="margin:0 0 12px">← Volver</button><b style="font-size:16px">'+esc(window.__CK.titulo)+'</b><div class="prog" style="margin:12px 0"><div style="width:'+pc+'%"></div></div><div style="font-size:12px;color:var(--muted)">'+done+'/'+it.length+'</div></div>';
  h+='<div class="mcard">'+it.map((x,i)=>'<div class="mpt'+(x.d?' done':'')+'" onclick="mgCkToggle('+i+')"><div class="st">'+(x.d?'✓':'○')+'</div><div style="flex:1">'+esc(x.t)+'</div></div>').join('');
  h+='<button class="mbtn pri" id="mgCkSave">Guardar avance</button></div>';
  $('#mgView').innerHTML=h;
  $('#mgCkSave').onclick=async()=>{const estado=it.every(x=>x.d)&&it.length?'completada':'pendiente';const {error}=await sb.from('checklists').update({items:JSON.stringify(it),estado}).eq('id',window.__CK.id);if(error)toast(error.message,true);else{toast('Checklist guardado');mgChecklist();}};
}
function mgCkToggle(i){window.__CK.items[i].d=!window.__CK.items[i].d;mgPaintCheck();}
function mgNota(){
  $('#mgView').innerHTML='<div class="mcard"><b style="font-size:16px">Registrar novedad</b><label>Tipo</label><select id="mgTipo"><option value="nota">Nota</option><option value="novedad">Novedad</option><option value="relevo">Relevo de turno</option></select><label>Instalación</label><select id="mgIns2">'+instOptions()+'</select><label>Descripción</label><textarea id="mgDes" rows="4"></textarea><button class="mbtn pri" id="mgSave">Guardar en bitácora</button></div>';
  $('#mgSave').onclick=async()=>{const des=mv('mgDes');if(!des){toast('Escribe una descripción',true);return;}const {error}=await sb.from('bitacora').insert({tipo:$('#mgTipo').value,instalacion_id:mv('mgIns2'),descripcion:des,empresa_id:ME.empresa_id});if(error)toast(error.message,true);else{toast('Novedad registrada');$('#mgDes').value='';}};
}
boot();
</script>
<script>
window.__CIDR = null;
window.ciDR = function(r, col, alt){
  var dr = window.__CIDR; if(!dr) return true;
  var v = r[col] || (alt? r[alt] : null); if(!v) return false;
  var ms = new Date(v).getTime(); if(isNaN(ms)) return false;
  return ms >= dr.from && ms <= dr.to;
};
(function(){
  var SECTIONS = {"Visitantes":1,"Veh\u00edculos":1,"Bit\u00e1cora":1};
  var MAXDAYS = 60;
  function sod(d){ d=new Date(d); d.setHours(0,0,0,0); return d; }
  function eod(d){ d=new Date(d); d.setHours(23,59,59,999); return d; }
  function fin(d){ d=new Date(d); var m=("0"+(d.getMonth()+1)).slice(-2), day=("0"+d.getDate()).slice(-2); return d.getFullYear()+"-"+m+"-"+day; }
  function trigger(){ var s=document.querySelector(".toolbar select"); if(s) s.dispatchEvent(new Event("change",{bubbles:true})); }
  function title(){ var h=document.querySelector(".topbar h2"); return h? h.textContent.trim():""; }
  function buildBar(){
    var tb=document.querySelector(".toolbar"); if(!tb) return;
    if(tb.querySelector(".ci-dr")) return;
    if(!SECTIONS[title()]) return;
    var minD=new Date(Date.now()-MAXDAYS*86400000);
    var w=document.createElement("div"); w.className="ci-dr";
    w.style.cssText="display:flex;gap:6px;align-items:center;flex-wrap:wrap";
    w.innerHTML="<span style=\"color:var(--muted);font-size:12px\">\ud83d\udcc5</span>"+
      "<input type=\"date\" class=\"ci-f\" min=\""+fin(minD)+"\" max=\""+fin(new Date())+"\" style=\"width:auto;padding:7px 9px;font-size:12px\">"+
      "<span style=\"color:var(--muted);font-size:12px\">a</span>"+
      "<input type=\"date\" class=\"ci-t\" min=\""+fin(minD)+"\" max=\""+fin(new Date())+"\" style=\"width:auto;padding:7px 9px;font-size:12px\">"+
      "<button class=\"btn xs sec ci-q\" data-d=\"0\">Hoy</button>"+
      "<button class=\"btn xs sec ci-q\" data-d=\"7\">7d</button>"+
      "<button class=\"btn xs sec ci-q\" data-d=\"30\">30d</button>"+
      "<button class=\"btn xs sec ci-q\" data-d=\"60\">60d</button>"+
      "<button class=\"btn xs sec ci-c\">Todo</button>";
    tb.appendChild(w);
    var fi=w.querySelector(".ci-f"), ti=w.querySelector(".ci-t");
    function apply(){
      var f=fi.value, tv=ti.value;
      if(!f && !tv){ window.__CIDR=null; trigger(); return; }
      var from=f? sod(f):minD; var to=tv? eod(tv):eod(new Date());
      if(from < sod(minD)) from=sod(minD);
      window.__CIDR={from:from.getTime(), to:to.getTime()};
      trigger();
    }
    fi.addEventListener("change",apply); ti.addEventListener("change",apply);
    w.querySelectorAll(".ci-q").forEach(function(b){ b.addEventListener("click",function(){
      var d=parseInt(b.getAttribute("data-d"),10); var to=new Date();
      var from=d===0? sod(new Date()):new Date(Date.now()-d*86400000);
      fi.value=fin(from); ti.value=fin(to); apply();
    }); });
    w.querySelector(".ci-c").addEventListener("click",function(){ fi.value=""; ti.value=""; window.__CIDR=null; trigger(); });
  }
  var mo=new MutationObserver(function(){ buildBar(); });
  function boot(){ var m=document.getElementById("main"); if(m){ mo.observe(m,{childList:true,subtree:true}); buildBar(); } else setTimeout(boot,300); }
  if(document.readyState!=="loading") boot(); else document.addEventListener("DOMContentLoaded",boot);
})();
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Inteligente</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0d13;--panel:#141924;--panel2:#1b2230;--accent:#6cbf3a;--text:#e7eaf0;--muted:#8a93a6;--ok:#35d0a5;--warn:#f5b544;--danger:#f76a6a;--border:#232c3d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 600px at 70% -10%,rgba(108,191,58,.12),transparent),var(--bg)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:34px;width:100%;max-width:390px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.logo .badge{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#4e9427);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;color:#08120a}
.logo h1{font-size:19px;letter-spacing:.5px}
.logo small{color:var(--muted);font-size:11px;display:block;font-weight:400}
label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:11px 12px;color:var(--text);font-size:14px;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.btn{width:100%;background:var(--accent);color:#08120a;border:none;border-radius:9px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:20px;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.btn.sm{width:auto;padding:8px 14px;margin:0;font-size:13px}
.btn.xs{width:auto;padding:5px 10px;margin:0;font-size:12px}
.btn.danger{background:var(--danger);color:#fff}
.msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px}
.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
#app{display:flex;min-height:100vh}
.side{width:236px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto}
.side .logo{padding:20px 18px;margin:0;border-bottom:1px solid var(--border)}
.nav{padding:10px;flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:9px;color:var(--muted);font-size:14px;cursor:pointer;margin-bottom:2px;transition:.12s;position:relative}
.nav a:hover{background:var(--panel2);color:var(--text)}
.nav a.active{background:rgba(108,191,58,.14);color:var(--accent);font-weight:600}
.nav .ico{width:20px;text-align:center}
.nav .badge2{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px}
.nav .sep{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:14px 13px 6px;opacity:.6}
.userbox{padding:14px 16px;border-top:1px solid var(--border);font-size:13px}
.userbox b{display:block;color:var(--text)}
.userbox span{color:var(--muted);font-size:11px}
.main{flex:1;margin-left:236px;padding:26px 30px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:14px;flex-wrap:wrap}
.topbar h2{font-size:22px}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
.pgActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:18px;position:relative;overflow:hidden}
.kpi .n{font-size:30px;font-weight:800}
.kpi .l{color:var(--muted);font-size:13px;margin-top:4px}
.kpi .ic{position:absolute;right:16px;top:16px;font-size:22px;opacity:.5}
.kpi.acc{border-left:3px solid var(--accent)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:20px;margin-bottom:20px}
.panel h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar input,.toolbar select{width:auto;padding:8px 11px;font-size:13px}
.toolbar .search{flex:1;min-width:180px;max-width:320px}
.count{color:var(--muted);font-size:12px;margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--border);font-size:12px;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
td{padding:11px 10px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--panel2)}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.tag.ok{background:rgba(53,208,165,.16);color:var(--ok)}
.tag.warn{background:rgba(245,181,68,.16);color:var(--warn)}
.tag.danger{background:rgba(247,106,106,.16);color:var(--danger)}
.tag.mut{background:var(--panel2);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:34px;font-size:13px}
.empty .big{font-size:34px;display:block;margin-bottom:8px;opacity:.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal.wide{max-width:640px}
.modal h3{margin-bottom:6px}
.modal .x{float:right;cursor:pointer;color:var(--muted);font-size:20px}
.row{display:flex;gap:10px}.row>*{flex:1}
.map{position:relative;height:440px;background:var(--panel2) url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22><path d=%22M0 0H40V40%22 fill=%22none%22 stroke=%22%23232c3d%22 stroke-width=%221%22/></svg>');border-radius:11px;overflow:hidden}
.pin{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer}
.pin .dot{width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 5px rgba(108,191,58,.25);margin:0 auto}
.pin .lbl{font-size:10px;color:var(--text);margin-top:3px;background:rgba(0,0,0,.5);padding:1px 5px;border-radius:4px;white-space:nowrap}
.prog{height:9px;background:var(--panel2);border-radius:6px;overflow:hidden}
.prog>div{height:100%;background:var(--accent);transition:width .3s}
.chk{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px;cursor:pointer;transition:.12s}
.chk:hover{background:var(--panel2)}
.chk.done{opacity:.6}.chk.done .txt{text-decoration:line-through}
.chk .box{width:20px;height:20px;border-radius:5px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chk.done .box{background:var(--accent);border-color:var(--accent);color:#08120a}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:9px;padding:13px 20px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:100;animation:slideup .25s}
.toast.err{border-left-color:var(--danger)}
@keyframes slideup{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.sos{position:fixed;bottom:26px;right:26px;background:var(--danger);color:#fff;border:none;width:64px;height:64px;border-radius:50%;font-size:11px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(247,106,106,.5);z-index:40}
.sos:hover{filter:brightness(1.1)}
.pill{display:inline-flex;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;align-items:center}
.detail-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px}
.detail-grid b{color:var(--muted);font-weight:600}
@media(max-width:760px){.side{width:100%;height:auto;position:static}.main{margin-left:0}#app{flex-direction:column}.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <div class="logo"><div class="badge">CI</div><div><h1>CONTROL INTELIGENTE</h1><small>Gestión de seguridad</small></div></div>
    <label>Correo</label>
    <input id="email" type="email" placeholder="correo@empresa.cl" autocomplete="username">
    <label>Contraseña</label>
    <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="btnLogin">Iniciar sesión</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>
<div id="app" class="hidden">
  <aside class="side">
    <div class="logo"><div class="badge">CI</div><div><h1 style="font-size:15px">CONTROL INTELIGENTE</h1><small id="empName">—</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="userbox">
      <b id="uName">—</b><span id="uRol">—</span>
      <button class="btn sec sm" id="btnLogout" style="margin-top:10px;width:100%">Cerrar sesión</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><h2 id="pgTitle">Panel</h2><div class="sub" id="pgSub"></div></div>
      <div class="pgActions" id="pgActions"></div>
    </div>
    <div id="view"></div>
  </main>
  <button class="sos" id="btnSos">SOS</button>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
const SB_URL='https://jnrkqmazotalwqkcbygh.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpucmtxbWF6b3RhbHdxa2NieWdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NjYyMjYsImV4cCI6MjEwMDM0MjIyNn0.CprxETe2BBZMZVF9Kjq4Ubh2tpOsdqV9Fbgm3UaYBqM';
const sb=supabase.createClient(SB_URL,SB_KEY);
let ME=null, EMP=null, INST_CACHE=[];
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fdate=d=>d?new Date(d).toLocaleString('es-CL',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
function toast(msg,err){const r=$('#toastRoot');const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;r.appendChild(t);setTimeout(()=>t.remove(),2800);}
$('#btnLogin').onclick=doLogin;
$('#pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
async function doLogin(){
  const m=$('#loginMsg'); m.className='msg'; m.textContent='Ingresando…';
  const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pass').value});
  if(error){m.className='msg err';m.textContent='Error: '+error.message;return;}
  await boot();
}
$('#btnLogout').onclick=async()=>{await sb.auth.signOut();location.reload();};
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('#login').classList.remove('hidden');$('#app').classList.add('hidden');return;}
  const {data:prof,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(error||!prof){$('#loginMsg').className='msg err';$('#loginMsg').textContent='No se encontró el perfil.';await sb.auth.signOut();return;}
  ME=prof;
  if(ME.empresa_id){const {data:e}=await sb.from('empresas').select('*').eq('id',ME.empresa_id).single();EMP=e;}
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  $('#uName').textContent=ME.nombre||ME.email;
  $('#uRol').textContent=rolLabel(ME.rol);
  $('#empName').textContent=EMP?EMP.nombre:(ME.rol==='super_admin'?'Todas las empresas':'—');
  const {data:ins}=await sb.from('instalaciones').select('*').order('nombre');INST_CACHE=ins||[];
  await buildNav();
  go(ME.rol==='guardia'?'rondas':'dashboard');
}
const rolLabel=r=>({super_admin:'Super Admin',admin:'Administrador',supervisor:'Supervisor',guardia:'Guardia',cliente:'Cliente'}[r]||r);
function toCSV(rows,cols){
  const head=cols.map(c=>'"'+c.h+'"').join(',');
  const body=rows.map(r=>cols.map(c=>'"'+String(c.v(r)).replace(/"/g,'""')+'"').join(',')).join('\n');
  return head+'\n'+body;
}
function downloadCSV(name,csv){
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  toast('Descargado: '+name);
}
const MENU=[
  {sep:'Operación'},
  {id:'dashboard',ic:'📊',t:'Panel',roles:['super_admin','admin','supervisor','cliente']},
  {id:'mapa',ic:'🗺️',t:'Mapa en vivo',roles:['super_admin','admin','supervisor']},
  {id:'rondas',ic:'🚶',t:'Rondas',roles:['super_admin','admin','supervisor','guardia']},
  {id:'checklists',ic:'✅',t:'Checklists',roles:['super_admin','admin','supervisor','guardia']},
  {id:'incidentes',ic:'⚠️',t:'Incidentes',roles:['super_admin','admin','supervisor','guardia','cliente'],badge:'incAbiertos'},
  {id:'bitacora',ic:'📓',t:'Bitácora',roles:['super_admin','admin','supervisor','guardia']},
  {sep:'Control de acceso'},
  {id:'visitantes',ic:'🚶‍♂️',t:'Visitantes',roles:['super_admin','admin','supervisor','guardia']},
  {id:'vehiculos',ic:'🚗',t:'Vehículos',roles:['super_admin','admin','supervisor','guardia']},
  {id:'puntos',ic:'📍',t:'Puntos NFC',roles:['super_admin','admin','supervisor']},
  {sep:'Administración'},
  {id:'guardias',ic:'👮',t:'Guardias',roles:['super_admin','admin','supervisor']},
  {id:'usuarios',ic:'👥',t:'Usuarios',roles:['super_admin','admin']},
  {id:'instalaciones',ic:'🏢',t:'Instalaciones',roles:['super_admin','admin']},
  {id:'reportes',ic:'📈',t:'Reportes',roles:['super_admin','admin','supervisor','cliente']},
  {id:'empresas',ic:'🏰',t:'Empresas',roles:['super_admin']}
];
let BADGES={incAbiertos:0};
async function refreshBadges(){
  const {count}=await sb.from('incidentes').select('id',{count:'exact',head:true}).neq('estado','cerrado');
  BADGES.incAbiertos=count||0;
  document.querySelectorAll('.nav a').forEach(a=>{
    const m=MENU.find(x=>x.id===a.dataset.id);
    const b=a.querySelector('.badge2');if(b)b.remove();
    if(m&&m.badge&&BADGES[m.badge]>0){const s=document.createElement('span');s.className='badge2';s.textContent=BADGES[m.badge];a.appendChild(s);}
  });
}
async function buildNav(){
  const nav=$('#nav');nav.innerHTML='';
  MENU.forEach(m=>{
    if(m.sep){const d=document.createElement('div');d.className='sep';d.textContent=m.sep;nav.appendChild(d);return;}
    if(!m.roles.includes(ME.rol))return;
    const a=document.createElement('a');a.dataset.id=m.id;a.innerHTML='<span class="ico">'+m.ic+'</span>'+m.t;
    a.onclick=()=>go(m.id);nav.appendChild(a);
  });
  await refreshBadges();
}
function go(id){
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.id===id));
  $('#pgActions').innerHTML='';
  (VIEWS[id]||VIEWS.dashboard)();
}
function setHead(t,s){$('#pgTitle').textContent=t;$('#pgSub').textContent=s||'';}
function actionBtn(label,fn,cls){const b=document.createElement('button');b.className='btn sm '+(cls||'');if(!cls)b.style.color='#08120a';b.textContent=label;b.onclick=fn;$('#pgActions').appendChild(b);}
const instName=id=>{const i=INST_CACHE.find(x=>x.id===id);return i?i.nombre:'—';};
function instOptions(sel){return '<option value="">— Instalación —</option>'+INST_CACHE.map(i=>'<option value="'+i.id+'"'+(sel===i.id?' selected':'')+'>'+esc(i.nombre)+'</option>').join('');}
function closeModal(){$('#modalRoot').innerHTML='';}
function openModal(title,bodyHtml,onSave,wide){
  $('#modalRoot').innerHTML='<div class="modal-bg"><div class="modal'+(wide?' wide':'')+'"><span class="x" id="mX">✕</span><h3>'+esc(title)+'</h3><div id="mBody">'+bodyHtml+'</div>'+(onSave?'<div class="msg" id="mMsg"></div><button class="btn" id="mSave">Guardar</button>':'')+'</div></div>';
  $('#mX').onclick=closeModal;
  document.querySelector('.modal-bg').onclick=e=>{if(e.target.classList.contains('modal-bg'))closeModal();};
  if(onSave)$('#mSave').onclick=async()=>{const mm=$('#mMsg');mm.className='msg';mm.textContent='Guardando…';try{await onSave();mm.className='msg ok';mm.textContent='Guardado';setTimeout(closeModal,400);}catch(e){mm.className='msg err';mm.textContent='Error: '+(e.message||e);}};
}
function mv(id){const el=document.getElementById(id);return el?(el.value.trim()||null):null;}
let TSTATE={};
async function renderTable(cfg){
  setHead(cfg.title,cfg.sub);
  TSTATE={data:[],search:'',sort:null,asc:true,filter:'',cfg};
  if(cfg.canCreate&&cfg.canCreate())actionBtn('+ '+cfg.createLabel,cfg.onCreate);
  if(cfg.exportable)actionBtn('⬇ CSV',()=>exportTable(),'sec');
  actionBtn('↻',()=>renderTable(cfg),'sec');
  let filterHtml='';
  if(cfg.filters)filterHtml='<select id="tFilter"><option value="">Todos</option>'+cfg.filters.map(f=>'<option value="'+f.v+'">'+f.l+'</option>').join('')+'</select>';
  $('#view').innerHTML='<div class="panel"><div class="toolbar"><input class="search" id="tSearch" placeholder="🔍 Buscar…">'+filterHtml+'<span class="count" id="tCount"></span></div><div id="tbl"><div class="empty">Cargando…</div></div></div>';
  let q=sb.from(cfg.table).select(cfg.select||'*');
  if(cfg.order)q=q.order(cfg.order.col,{ascending:cfg.order.asc!==false});
  const {data,error}=await q;
  if(error){$('#tbl').innerHTML='<div class="empty">Error: '+esc(error.message)+'</div>';return;}
  TSTATE.data=data||[];
  const s=$('#tSearch');s.oninput=()=>{TSTATE.search=s.value.toLowerCase();paintTable();};
  const f=$('#tFilter');if(f)f.onchange=()=>{TSTATE.filter=f.value;paintTable();};
  paintTable();
}
function paintTable(){
  const {data,cfg,search,filter,sort,asc}=TSTATE;
  let rows=data.slice();
  if(filter&&cfg.filterFn)rows=rows.filter(r=>cfg.filterFn(r,filter));
  if(search)rows=rows.filter(r=>cfg.cols.some(c=>{const v=c.raw?c.raw(r):(c.k?r[c.k]:'');return String(v==null?'':v).toLowerCase().includes(search);}));
  if(sort!=null){const c=cfg.cols[sort];rows.sort((a,b)=>{const va=c.raw?c.raw(a):a[c.k],vb=c.raw?c.raw(b):b[c.k];return (va>vb?1:va<vb?-1:0)*(asc?1:-1);});}
  $('#tCount').textContent=rows.length+' de '+data.length;
  const el=$('#tbl');
  if(!rows.length){el.innerHTML=cfg.emptyHtml||'<div class="empty"><span class="big">📭</span>Sin registros.</div>';return;}
  let h='<table><thead><tr>'+cfg.cols.map((c,i)=>'<th data-i="'+i+'">'+c.h+(sort===i?(asc?' ↑':' ↓'):'')+'</th>').join('')+(cfg.actions?'<th></th>':'')+'</tr></thead><tbody>';
  rows.forEach(r=>{h+='<tr>'+cfg.cols.map(c=>'<td>'+(c.r?c.r(r):esc(r[c.k]))+'</td>').join('')+(cfg.actions?'<td style="text-align:right">'+cfg.actions(r)+'</td>':'')+'</tr>';});
  h+='</tbody></table>';el.innerHTML=h;
  el.querySelectorAll('th[data-i]').forEach(th=>th.onclick=()=>{const i=+th.dataset.i;TSTATE.asc=TSTATE.sort===i?!TSTATE.asc:true;TSTATE.sort=i;paintTable();});
}
function exportTable(){
  const {cfg,data}=TSTATE;
  const cols=cfg.cols.map(c=>({h:c.h,v:r=>{const v=c.raw?c.raw(r):(c.k?r[c.k]:'');return v==null?'':v;}}));
  downloadCSV(cfg.table+'.csv',toCSV(data,cols));
}
const prTag=p=>{const m={alta:'danger',media:'warn',baja:'mut'}[p]||'mut';return '<span class="tag '+m+'">'+esc(p||'—')+'</span>';};
const stTag=s=>{const m={abierto:'danger',en_proceso:'warn',cerrado:'ok',activo:'ok',inactivo:'mut',pendiente:'warn',completada:'ok',en_curso:'warn'}[s]||'mut';return '<span class="tag '+m+'">'+esc((s||'—').replace('_',' '))+'</span>';};
const VIEWS={};
VIEWS.dashboard=async function(){
  setHead('Panel de control','Resumen operativo'+(EMP?' — '+EMP.nombre:''));
  actionBtn('↻ Actualizar',()=>go('dashboard'),'sec');
  $('#view').innerHTML='<div class="kpis" id="kpis"></div><div class="grid2"><div class="panel"><h3>Incidentes recientes</h3><div id="dIn"></div></div><div class="panel"><h3>Actividad reciente</h3><div id="dAct"></div></div></div>';
  const [inc,gu,ro,vis,veh,bit]=await Promise.all([
    sb.from('incidentes').select('*').order('created_at',{ascending:false}),
    sb.from('guardias').select('id,estado'),
    sb.from('rondas').select('*').order('created_at',{ascending:false}),
    sb.from('visitantes').select('id,salida,nombre,created_at'),
    sb.from('vehiculos').select('id,salida,patente,created_at'),
    sb.from('bitacora').select('*').order('created_at',{ascending:false}).limit(10)
  ]);
  const abiertos=(inc.data||[]).filter(i=>i.estado!=='cerrado').length;
  const activos=(gu.data||[]).filter(g=>g.estado==='activo').length;
  const visDentro=(vis.data||[]).filter(v=>!v.salida).length;
  const rondasCurso=(ro.data||[]).filter(r=>r.estado==='en_curso').length;
  const vehDentro=(veh.data||[]).filter(v=>!v.salida).length;
  const kpi=[['Incidentes abiertos',abiertos,'⚠️',abiertos>0],['Guardias activos',activos+'/'+(gu.data||[]).length,'👮'],['Rondas en curso',rondasCurso,'🚶'],['Instalaciones',INST_CACHE.length,'🏢'],['Visitantes dentro',visDentro,'🚶‍♂️'],['Vehículos dentro',vehDentro,'🚗']];
  $('#kpis').innerHTML=kpi.map(k=>'<div class="kpi'+(k[3]?' acc':'')+'"><span class="ic">'+k[2]+'</span><div class="n">'+k[1]+'</div><div class="l">'+k[0]+'</div></div>').join('');
  const inR=(inc.data||[]).slice(0,6);
  $('#dIn').innerHTML=inR.length?'<table><tbody>'+inR.map(i=>'<tr><td>'+esc(i.titulo)+'</td><td>'+prTag(i.prioridad)+'</td><td>'+stTag(i.estado)+'</td></tr>').join('')+'</tbody></table>':'<div class="empty"><span class="big">✅</span>Sin incidentes.</div>';
  let act=[];
  (bit.data||[]).forEach(b=>act.push([b.created_at,'📓','Bitácora: '+(b.descripcion||b.tipo||'')]));
  (vis.data||[]).forEach(v=>act.push([v.created_at,'🚶‍♂️','Visita: '+(v.nombre||'')]));
  (veh.data||[]).forEach(v=>act.push([v.created_at,'🚗','Vehículo: '+(v.patente||'')]));
  (inc.data||[]).forEach(i=>act.push([i.created_at,'⚠️','Incidente: '+(i.titulo||'')]));
  act.sort((a,b)=>new Date(b[0])-new Date(a[0]));act=act.slice(0,8);
  $('#dAct').innerHTML=act.length?act.map(a=>'<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px"><span>'+a[1]+'</span><span style="flex:1">'+esc(a[2].slice(0,60))+'</span><span style="color:var(--muted);font-size:11px">'+fdate(a[0])+'</span></div>').join(''):'<div class="empty"><span class="big">🕒</span>Sin actividad.</div>';
};
VIEWS.mapa=async function(){

  const map=$('#map');
  if(!INST_CACHE.length){map.innerHTML='<div class="empty" style="padding-top:190px"><span class="big">🗺️</span>Sin instalaciones registradas.</div>';return;}
  const {data:gu}=await sb.from('guardias').select('id,instalacion_id,estado,nombre');
  INST_CACHE.slice(0,14).forEach((i,idx)=>{
    const x=10+(idx*29%80),y=14+((idx*41)%72);
    const gs=(gu||[]).filter(g=>g.instalacion_id===i.id&&g.estado==='activo');
    const col=gs.length>0?'var(--ok)':'var(--warn)';
    const p=document.createElement('div');p.className='pin';p.style.left=x+'%';p.style.top=y+'%';
    p.innerHTML='<div class="dot" style="background:'+col+'"></div><div class="lbl">'+esc(i.nombre)+' · '+gs.length+' 👮</div>';
    p.onclick=()=>openModal(i.nombre,'<div class="detail-grid"><b>Dirección</b><span>'+esc(i.direccion||'—')+'</span><b>Guardias activos</b><span>'+gs.length+'</span><b>Personal</b><span>'+(gs.map(g=>esc(g.nombre)).join(', ')||'—')+'</span></div>');
    map.appendChild(p);
  });
};

async function checkVer(id){
  const r=TSTATE.data.find(x=>x.id===id);if(!r)return;
  window.__CK={id,items:parseItems(r.items)};
  renderCheckModal(r.titulo);
}
function renderCheckModal(titulo){
  const it=window.__CK.items;const done=it.filter(x=>x.d).length;const pc=it.length?Math.round(done/it.length*100):0;
  let h='<div style="margin-bottom:6px;font-size:13px;color:var(--muted)">'+done+'/'+it.length+' completados</div><div class="prog" style="margin-bottom:16px"><div style="width:'+pc+'%"></div></div>';
  h+=it.map((x,i)=>'<div class="chk'+(x.d?' done':'')+'" onclick="ckToggle('+i+')"><div class="box">'+(x.d?'✓':'')+'</div><div class="txt">'+esc(x.t)+'</div></div>').join('');
  openModal(titulo,h,async()=>{
    const estado=it.every(x=>x.d)&&it.length?'completada':'pendiente';
    const res=await sb.from('checklists').update({items:JSON.stringify(it),estado}).eq('id',window.__CK.id);
    if(res.error)throw res.error;toast('Checklist guardado');go('checklists');
  },true);
  document.querySelector('#mSave').textContent='Guardar avance';
}
function ckToggle(i){window.__CK.items[i].d=!window.__CK.items[i].d;const cur=document.querySelector('.modal h3').textContent;renderCheckModal(cur);}

VIEWS.reportes=async function(){
  setHead('Reportes','Indicadores del periodo');
  $('#view').innerHTML='<div class="kpis" id="rk"></div><div class="grid2"><div class="panel"><h3>Incidentes por prioridad</h3><div id="rb"></div></div><div class="panel"><h3>Incidentes por estado</h3><div id="rb2"></div></div></div>';
  const [inc,vis,veh,ro]=await Promise.all([sb.from('incidentes').select('prioridad,estado,titulo,created_at'),sb.from('visitantes').select('id'),sb.from('vehiculos').select('id'),sb.from('rondas').select('estado')]);
  const I=inc.data||[];
  actionBtn('⬇ Exportar incidentes',()=>downloadCSV('incidentes.csv',toCSV(I,[{h:'Titulo',v:r=>r.titulo},{h:'Prioridad',v:r=>r.prioridad},{h:'Estado',v:r=>r.estado},{h:'Fecha',v:r=>r.created_at}])),'sec');
  const cerr=(ro.data||[]).filter(r=>r.estado==='completada').length;
  $('#rk').innerHTML=[['Incidentes totales',I.length,'⚠️'],['Rondas completadas',cerr,'✅'],['Visitas registradas',(vis.data||[]).length,'🚶‍♂️'],['Vehículos',(veh.data||[]).length,'🚗']].map(k=>'<div class="kpi"><span class="ic">'+k[2]+'</span><div class="n">'+k[1]+'</div><div class="l">'+k[0]+'</div></div>').join('');
  const bar=(obj,el)=>{const max=Math.max(1,...Object.values(obj));$(el).innerHTML=Object.entries(obj).map(([k,v])=>'<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>'+k.replace('_',' ')+'</span><b>'+v+'</b></div><div class="prog"><div style="width:'+(v/max*100)+'%"></div></div></div>').join('');};
  const pr={alta:0,media:0,baja:0};I.forEach(i=>{if(pr[i.prioridad]!=null)pr[i.prioridad]++;});bar(pr,'#rb');
  const es={abierto:0,en_proceso:0,cerrado:0};I.forEach(i=>{if(es[i.estado]!=null)es[i.estado]++;});bar(es,'#rb2');
};
$('#btnSos').onclick=async()=>{

  if(error)toast('Error: '+error.message,true);else{toast('🚨 Alerta SOS enviada');await refreshBadges();}
};

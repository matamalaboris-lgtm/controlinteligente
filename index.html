<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Inteligente</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0d13;--bg2:#0f131b;--panel:#141924;--panel2:#1b2130;--border:rgba(255,255,255,.09);--text:#e7eaf0;--text2:#9aa3b5;--accent:#6cbf3a;--ok:#35d0a5;--warn:#f5b544;--danger:#f76a6a;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;min-height:100vh}
.hidden{display:none!important}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:380px}
.logo{width:56px;height:56px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:#08260a;font-size:22px;margin:0 auto 14px}
h1{font-size:20px;text-align:center}
.sub{color:var(--text2);text-align:center;font-size:13px;margin-bottom:20px}
label{display:block;font-size:11px;letter-spacing:.5px;color:var(--text2);text-transform:uppercase;margin:14px 0 6px}
input,select{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:var(--text);font-size:14px;outline:none}
input:focus{border-color:var(--accent)}
.btn{width:100%;background:var(--accent);color:#08260a;border:none;border-radius:10px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:18px}
.btn:disabled{opacity:.6;cursor:wait}
.err{color:var(--danger);font-size:13px;margin-top:12px;min-height:16px;text-align:center}
.app{display:flex;min-height:100vh}
.side{width:230px;background:var(--bg2);border-right:1px solid var(--border);padding:18px 12px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;border-bottom:1px solid var(--border);margin-bottom:12px}
.brand .logo{width:34px;height:34px;font-size:15px;margin:0}
.brand b{font-size:15px}
.nav a{display:block;padding:10px 12px;border-radius:9px;color:var(--text2);text-decoration:none;font-size:14px;cursor:pointer;margin-bottom:2px}
.nav a:hover{background:var(--panel)}
.nav a.on{background:var(--accent);color:#08260a;font-weight:600}
.main{flex:1;padding:26px 30px;overflow:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.top h2{font-size:22px}
.who{text-align:right;font-size:13px}
.who .role{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--accent);text-transform:uppercase;margin-top:3px}
.logout{background:none;border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;margin-left:14px}
.tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.tbl th{text-align:left;padding:12px 14px;font-size:11px;text-transform:uppercase;color:var(--text2);background:var(--panel2);letter-spacing:.5px}
.tbl td{padding:12px 14px;border-top:1px solid var(--border);font-size:14px}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px}
.pill.abierto{background:rgba(247,106,106,.15);color:var(--danger)}
.pill.cerrado,.pill.resuelto{background:rgba(53,208,165,.15);color:var(--ok)}
.pill.activa,.pill.disponible{background:rgba(108,191,58,.16);color:var(--accent)}
.empty{color:var(--text2);text-align:center;padding:40px;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px}
.kpi .n{font-size:30px;font-weight:700;color:var(--accent)}
.kpi .l{color:var(--text2);font-size:13px;margin-top:4px}
</style>
</head>
<body>
<div id="login" class="center">
  <div class="card">
    <div class="logo">CI</div>
    <h1>Centro de Operaciones</h1>
    <div class="sub">Ingresa a tu cuenta para continuar</div>
    <label>Correo</label>
    <input id="email" type="email" autocomplete="username" placeholder="tucorreo@empresa.cl">
    <label>Contrase&ntilde;a</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button class="btn" id="loginBtn">Iniciar sesi&oacute;n</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>
<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand"><div class="logo">CI</div><b>Control Inteligente</b></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <div class="top">
      <h2 id="title">Panel</h2>
      <div style="display:flex;align-items:center">
        <div class="who"><div id="uname"></div><div class="role" id="urole"></div></div>
        <button class="logout" id="logoutBtn">Salir</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>
<script>
const sb = supabase.createClient('https://jnrkqmazotalwqkcbygh.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpucmtxbWF6b3RhbHdxa2NieWdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NjYyMjYsImV4cCI6MjEwMDM0MjIyNn0.CprxETe2BBZMZVF9Kjq4Ubh2tpOsdqV9Fbgm3UaYBqM');
let perfil = null;
const $ = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const MENUS = {
  super_admin:[['dashboard','Panel'],['empresas','Empresas'],['instalaciones','Instalaciones'],['guardias','Guardias'],['incidentes','Incidentes']],
  admin:[['dashboard','Panel'],['instalaciones','Instalaciones'],['guardias','Guardias'],['incidentes','Incidentes']],
  supervisor:[['dashboard','Panel'],['instalaciones','Instalaciones'],['guardias','Guardias'],['incidentes','Incidentes']],
  guardia:[['dashboard','Panel'],['incidentes','Incidentes']],
  cliente:[['dashboard','Panel'],['incidentes','Incidentes']]
};
async function doLogin(){
  const btn=$('loginBtn'); btn.disabled=true; $('loginErr').textContent='';
  const email=$('email').value.trim(), password=$('pass').value;
  if(!email||!password){ $('loginErr').textContent='Ingresa correo y contrasena'; btn.disabled=false; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ $('loginErr').textContent='Credenciales invalidas'; btn.disabled=false; return; }
  await startSession(); btn.disabled=false;
}
async function startSession(){
  const { data:p, error } = await sb.from('profiles').select('rol,empresa_id,nombre,email').single();
  if(error||!p){ $('loginErr').textContent='No se pudo cargar el perfil'; return; }
  perfil=p;
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('uname').textContent=p.nombre||p.email; $('urole').textContent=p.rol||'';
  renderNav(); go('dashboard');
}
function renderNav(){
  const items=MENUS[perfil.rol]||MENUS.guardia;
  $('nav').innerHTML=items.map(([k,l])=>'<a data-k="'+k+'">'+l+'</a>').join('');
  [...$('nav').children].forEach(a=>a.onclick=()=>go(a.dataset.k));
}
function setActive(k){ [...$('nav').children].forEach(a=>a.classList.toggle('on',a.dataset.k===k)); }
async function go(k){
  setActive(k);
  const titles={dashboard:'Panel',empresas:'Empresas',instalaciones:'Instalaciones',guardias:'Guardias',incidentes:'Incidentes'};
  $('title').textContent=titles[k]||k;
  $('view').innerHTML='<div class="empty">Cargando...</div>';
  try{
    if(k==='dashboard') return renderDashboard();
    if(k==='empresas') return renderTable('empresas',['nombre','rut','plan','estado'],['Nombre','RUT','Plan','Estado']);
    if(k==='instalaciones') return renderTable('instalaciones',['nombre','direccion'],['Nombre','Direccion']);
    if(k==='guardias') return renderTable('guardias',['nombre','rut','estado'],['Nombre','RUT','Estado']);
    if(k==='incidentes') return renderTable('incidentes',['titulo','prioridad','estado'],['Titulo','Prioridad','Estado']);
  }catch(e){ $('view').innerHTML='<div class="empty">Error: '+esc(e.message)+'</div>'; }
}
async function renderTable(tabla, cols, heads){
  const { data, error } = await sb.from(tabla).select('*').order('created_at',{ascending:false});
  if(error){ $('view').innerHTML='<div class="empty">Error: '+esc(error.message)+'</div>'; return; }
  if(!data||!data.length){ $('view').innerHTML='<div class="empty">Sin registros para tu empresa.</div>'; return; }
  let h='<table class="tbl"><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>';
  h+=data.map(r=>'<tr>'+cols.map(c=>{
    const v=r[c];
    if(c==='estado') return '<td><span class="pill '+esc((v||'').toLowerCase())+'">'+esc(v)+'</span></td>';
    return '<td>'+esc(v)+'</td>';
  }).join('')+'</tr>').join('');
  h+='</tbody></table>';
  $('view').innerHTML=h;
}
async function renderDashboard(){
  const tablas=['incidentes','instalaciones','guardias'];
  const counts={};
  for(const t of tablas){ const {count}=await sb.from(t).select('*',{count:'exact',head:true}); counts[t]=count||0; }
  $('view').innerHTML='<div class="cards">'+
    '<div class="kpi"><div class="n">'+counts.incidentes+'</div><div class="l">Incidentes</div></div>'+
    '<div class="kpi"><div class="n">'+counts.instalaciones+'</div><div class="l">Instalaciones</div></div>'+
    '<div class="kpi"><div class="n">'+counts.guardias+'</div><div class="l">Guardias</div></div>'+
    '</div>';
}
$('loginBtn').onclick=doLogin;
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
$('logoutBtn').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
(async()=>{ const { data:{ session } } = await sb.auth.getSession(); if(session) await startSession(); })();
</script>
</body>
</html>
